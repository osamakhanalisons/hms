version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: at_bms_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: at_bms
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: at_bms_web
    ports:
      - "3000:3000"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=root123
      - MYSQL_DATABASE=at_bms
      - SESSION_SECRET=at-bms-secure-session-secret-random-32-chars
    depends_on:
      mysql:
        condition: service_healthy
    restart: always

volumes:
  mysql_data:
